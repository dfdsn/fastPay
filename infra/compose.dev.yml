# Ambiente local de desenvolvimento (dados sintéticos). Não usar em produção.
# Da raiz: docker compose --env-file .env -f infra/compose.dev.yml up -d --build
name: fastpay-dev

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastpay}
      POSTGRES_USER: ${POSTGRES_USER:-fastpay_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Papéis criados por init/01-roles.sh na primeira inicialização do volume (H03).
      FASTPAY_MIGRATION_PASSWORD: ${FASTPAY_MIGRATION_PASSWORD:?defina FASTPAY_MIGRATION_PASSWORD no .env}
      FASTPAY_APP_PASSWORD: ${FASTPAY_APP_PASSWORD:?defina FASTPAY_APP_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    # Sem porta publicada: o banco só é acessível pela rede interna.
    healthcheck:
      # Por TCP: durante o init o servidor temporário só escuta no socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    image: fastpay-backend:dev
    environment:
      APP_ENV: development
      JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fastpay}
      JDBC_APP_PASSWORD: ${FASTPAY_APP_PASSWORD}
      JDBC_MIGRATION_PASSWORD: ${FASTPAY_MIGRATION_PASSWORD}
      # H08: link de redefinição aponta para o frontend local; a caixa de teste fica legível em
      # /api/v1/dev/caixa-de-teste (só dev, nenhum e-mail real é enviado até H12).
      PASSWORD_RESET_LINK_BASE: http://127.0.0.1:${FASTPAY_HTTP_PORT:-8088}/redefinir-senha
      TEST_MAILBOX_ENDPOINT: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    image: fastpay-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FASTPAY_HTTP_PORT:-8088}:8080"
    networks: [internal, edge]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}

volumes:
  db-data:
