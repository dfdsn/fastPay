# Ambiente local de desenvolvimento (dados sintéticos). Não usar em produção.
# Da raiz: docker compose --env-file .env -f infra/compose.dev.yml up -d --build
name: fastpay-dev

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastpay}
      POSTGRES_USER: ${POSTGRES_USER:-fastpay_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql
    networks: [internal]
    # Sem porta publicada: o banco só é acessível pela rede interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    image: fastpay-backend:dev
    environment:
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    image: fastpay-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FASTPAY_HTTP_PORT:-8088}:8080"
    networks: [internal, edge]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}

volumes:
  db-data:
