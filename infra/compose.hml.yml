# Homologação na máquina de Diego (Docker Desktop/WSL2) com as imagens publicadas pela CI no GHCR privado.
# Não constrói nada: roda exatamente a versão indicada. Exige `docker login ghcr.io` com token de leitura.
# Da raiz: docker compose --env-file .env.hml -f infra/compose.hml.yml up -d
# Tunnel de callbacks (hooks-hml-fastpay.malyah.tech), e-mail e PSP entram nas histórias próprias (T-02).
name: fastpay-hml

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastpay}
      POSTGRES_USER: ${POSTGRES_USER:-fastpay_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.hml}
      # Papéis criados por init/01-roles.sh na primeira inicialização do volume (H03).
      FASTPAY_MIGRATION_PASSWORD: ${FASTPAY_MIGRATION_PASSWORD:?defina FASTPAY_MIGRATION_PASSWORD no .env.hml}
      FASTPAY_APP_PASSWORD: ${FASTPAY_APP_PASSWORD:?defina FASTPAY_APP_PASSWORD no .env.hml}
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      # Por TCP: durante o init o servidor temporário só escuta no socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ghcr.io/${FASTPAY_IMAGE_OWNER:?defina FASTPAY_IMAGE_OWNER}/fastpay-backend:${FASTPAY_VERSION:?defina FASTPAY_VERSION (tag sha-<commit> ou release)}
    pull_policy: always
    environment:
      APP_ENV: homologation
      JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fastpay}
      JDBC_APP_PASSWORD: ${FASTPAY_APP_PASSWORD}
      JDBC_MIGRATION_PASSWORD: ${FASTPAY_MIGRATION_PASSWORD}
      # H12: e-mail. Padrão: caixa de teste em memória (nenhum envio). Envio real pelo Gmail dedicado só com
      # MAIL_TRANSPORT=smtp, SMTP_* e MAIL_ALLOWED_RECIPIENTS no .env.hml; sem a lista o backend não sobe.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8089}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-caixa-de-teste}
      MAIL_FROM: ${MAIL_FROM:-fastPay <nao-responda@fastpay.invalid>}
      MAIL_ALLOWED_RECIPIENTS: ${MAIL_ALLOWED_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # H09: chave do segredo TOTP, fora do banco. Obrigatória; sem ela o backend não sobe.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?defina MFA_ENCRYPTION_KEY no .env.hml}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    image: ghcr.io/${FASTPAY_IMAGE_OWNER}/fastpay-frontend:${FASTPAY_VERSION}
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FASTPAY_HTTP_PORT:-8089}:8080"
    networks: [internal, edge]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}

volumes:
  db-data:
