spring:
  application:
    name: fastpay
  mvc:
    problemdetails:
      enabled: true
  # Runtime com papel não privilegiado (sem BYPASSRLS, não dono das tabelas); ver infra/postgres/init.
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/fastpay}
    username: fastpay_app
    password: ${JDBC_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${JDBC_POOL_SIZE:10}
  # Flyway é a única fonte de schema e usa credencial própria. Em produção a migração roda fora do
  # processo web (FLYWAY_ENABLED=false na aplicação; passo separado no deploy, H50).
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/fastpay}
    user: fastpay_migration
    password: ${JDBC_MIGRATION_PASSWORD:}
    schemas: fastpay
    default-schema: fastpay
    create-schemas: false
    placeholders:
      # Nome fixo: o papel é criado por infra/postgres/init/01-roles.sh.
      app_role: fastpay_app
  # Spring Session JDBC (H08): schema pelo Flyway (V5); limpeza de sessões vencidas pelo próprio Spring Session.
  session:
    jdbc:
      initialize-schema: never
  autoconfigure:
    # Sem usuário em memória: login só pela identidade da equipe (H08).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fastpay

fastpay:
  # APP_ENV: development | homologation | production
  environment: ${APP_ENV:development}
  # Fila de efeitos assíncronos (H04, especificação §9). Configuração técnica, não limite de loja.
  jobs:
    worker-enabled: ${JOBS_WORKER_ENABLED:true}
    poll-interval: 5s
    batch-size: 10
    lease: 5m
    # Não financeiros: tentativas totais, contando a primeira. Financeiros não têm teto.
    max-attempts: 5
    initial-backoff: 15s
    backoff-multiplier: 2.0
    max-backoff: 5m
  # Login e redefinição de senha (H08). Política de senha e limites aprovados em P-07/T-03.
  auth:
    password-min-length: 12
    bcrypt-strength: 12
    reset-link-base: ${PASSWORD_RESET_LINK_BASE:http://127.0.0.1:8088/redefinir-senha}
    login-failures-per-account: 5
    login-failures-per-client: 20
    login-window: 15m
    reset-requests-per-account: 3
    reset-requests-per-client: 10
    reset-failures-per-client: 10
    reset-window: 1h
    # Cookie de sessão FASTPAY_SESSION (HttpOnly, SameSite=Lax). Secure só pode ser desligado em dev sem HTTPS.
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
    # Caixa de teste legível pela API: só desenvolvimento local (expõe links de redefinição).
    test-mailbox-endpoint: ${TEST_MAILBOX_ENDPOINT:false}
    # MFA (H09). Chave AES-256 do segredo TOTP, em Base64, guardada fora do banco; obrigatória, sem padrão.
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    mfa-issuer: fastPay
    mfa-failures-per-account: 5
    # Prazo para digitar o código ou cadastrar o autenticador depois da senha.
    mfa-pending-timeout: 10m

server:
  port: ${SERVER_PORT:8080}
  # Endereço do cliente e esquema vindos do proxy (nginx/tunnel), aceitos só de redes internas.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
