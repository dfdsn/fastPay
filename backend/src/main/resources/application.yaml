spring:
  application:
    name: fastpay
  mvc:
    problemdetails:
      enabled: true
  # Runtime com papel não privilegiado (sem BYPASSRLS, não dono das tabelas); ver infra/postgres/init.
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/fastpay}
    username: fastpay_app
    password: ${JDBC_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${JDBC_POOL_SIZE:10}
  # Flyway é a única fonte de schema e usa credencial própria. Em produção a migração roda fora do
  # processo web (FLYWAY_ENABLED=false na aplicação; passo separado no deploy, H50).
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/fastpay}
    user: fastpay_migration
    password: ${JDBC_MIGRATION_PASSWORD:}
    schemas: fastpay
    default-schema: fastpay
    create-schemas: false
    placeholders:
      # Nome fixo: o papel é criado por infra/postgres/init/01-roles.sh.
      app_role: fastpay_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fastpay

fastpay:
  # APP_ENV: development | homologation | production
  environment: ${APP_ENV:development}
  # Fila de efeitos assíncronos (H04, especificação §9). Configuração técnica, não limite de loja.
  jobs:
    worker-enabled: ${JOBS_WORKER_ENABLED:true}
    poll-interval: 5s
    batch-size: 10
    lease: 5m
    # Não financeiros: tentativas totais, contando a primeira. Financeiros não têm teto.
    max-attempts: 5
    initial-backoff: 15s
    backoff-multiplier: 2.0
    max-backoff: 5m

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
